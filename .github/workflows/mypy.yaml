name: Type Check

on: [push]

jobs:
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install .[dev]
          pip install mypy
      - name: Run mypy
        run: |
          mypy vivcpy