name: Delete workflow runs
on:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  delete-workflow-runs:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 3